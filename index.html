function beep(f,d=.15){if(!sfx)return;try{AC=AC||new AudioContext();const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;g.gain.value=.08;g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
function setMus(){clearInterval(mt);if(musOn&&PL&&!PL.paused){const sc=[523,587,659,784,880];mt=setInterval(()=>{try{AC=AC||new AudioContext();const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=sc[Math.floor(Math.random()*5)]/2;g.gain.value=.03;g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+.6);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+.6)}catch(e){}},550)}}
const exCard=x=>`<button class="card ex" data-a="ex" data-id="${x.id}"><b>${x.n}</b><small>${x.m}</small><div style="margin-top:8px"><span class="chip ${x.l==3?'hot':''}">${LV[x.l]}</span><span class="chip">${x.du}</span></div></button>`;
const meta=w=>`${Math.ceil(wDur(w)/60)} min · ${w.items.length} exercises · no equipment`;
const V0={
home(){const w=PRE[0];return `<section class="hero"><div><span class="chip hot">${streak()}-day streak</span><h1>Your little space to move, grow <em>&amp; glow.</em></h1><p>Eight gentle minutes, a cheering cherry bestie and zero equipment. Show up for yourself.</p><button class="btn" data-a="start" data-id="p_full">Start Working Out</button></div><div class="hc"><div class="bub" id="hb">You’ve got this, girl!</div>${CHAR('jacks')}<span class="st" style="left:6%;top:20%">${STAR}</span><span class="st" style="right:8%;top:8%;animation-delay:-1s">${STAR}</span><span class="st" style="right:14%;bottom:20%;animation-delay:-2s">${STAR}</span></div></section>
<h2>Today’s <em>workout</em></h2><div class="card row" style="justify-content:space-between"><div><h3>${w.name}</h3><span class="chip">${Math.ceil(wDur(w)/60)} min</span><span class="chip">Beginner friendly</span><span class="chip">${w.items.length} exercises</span><span class="chip">No equipment</span></div><button class="btn" data-a="start" data-id="p_full">Start workout</button></div>
<h2>Pick your <em>mood</em></h2><div class="grid">${PRE.map(w=>`<button class="cat" data-a="cat" data-k="${w.k}"><b>${w.cat}</b><small>${meta(w)}</small></button>`).join('')}</div>
<h2>Your <em>progress</em></h2>${stats()}`},
workouts(){const w=PRE.find(x=>x.k==SC);return `<h1>Workouts</h1><p>Choose a category, then press start.</p><div class="grid">${PRE.map(w=>`<button class="cat ${w.k==SC?'on':''}" data-a="cat" data-k="${w.k}"><b>${w.cat}</b><small>${w.desc}</small></button>`).join('')}</div>`+(w?`<div class="card" style="margin-top:18px"><h3>${w.name}</h3><p>${w.desc} ${meta(w)}</p>${w.items.map(i=>`<span class="chip">${X[i.id].n} · ${i.d}s</span>`).join('')}<div class="row" style="margin-top:14px"><button class="btn" data-a="start" data-id="${w.id}">Start workout</button><button class="btn s" data-a="clone" data-id="${w.id}">Customize</button></div></div>`:'')},
cali(){const ids=['squat','glute','lunge','pushup','mountain','plank'],L=l=>XS.filter(x=>(x.c=='cali'||ids.includes(x.id))&&x.l==l);return `<h1>Calisthenics <em>Corner</em></h1><p>Bodyweight strength, one gentle step at a time.</p>`+[1,2,3].map(l=>`<h2>${LV[l]}</h2>${l==3?'<div class="warn">Advanced moves need strong foundations. Master the beginner and intermediate steps first and use the progressions shown.</div>':''}<div class="grid">${L(l).map(exCard).join('')}</div>`).join('')},
lib(){return `<h1>Exercise <em>Library</em></h1><input data-f="lq" placeholder="Search exercises" aria-label="Search exercises" value="${esc(LQ)}"><div style="margin:12px 0">${['all',...Object.keys(CL)].map(k=>`<button class="chip ${LF==k?'hot':''}" style="border:0" data-a="lf" data-k="${k}">${k=='all'?'All':CL[k]}</button>`).join('')}</div><div class="grid" id="lr">${lib()}</div>`},
mine(){if(ED)return editor();return `<h1>My <em>Workouts</em></h1><p>Build routines that feel like you.</p><button class="btn" data-a="new">${ic(I.plus)} New workout</button><div style="margin-top:16px">${S.ws.length?S.ws.map(w=>`<div class="li"><b>${esc(w.name)}<br><small style="font-weight:400;color:var(--mut)">${meta(w)}</small></b><button class="btn sm" data-a="start" data-id="${w.id}">Start</button><button class="btn sm s" data-a="edit" data-id="${w.id}">Edit</button></div>`).join(''):'<div class="card">No saved workouts yet. Create one, or add moves from the Library.</div>'}</div>`},
prog(){const days=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);return d}),s=new Set(S.h.map(x=>x.d)),n=S.h.length,B=[['First workout',n>=1],['3-day streak',streak()>=3],['10 workouts',n>=10],['60 active minutes',mins()>=60],['Routine maker',S.ws.length>=1]];
return `<h1>Your <em>progress</em></h1>${stats()}<h2>This week</h2><div class="card cal">${days.map(d=>`<div>${d.toLocaleDateString('en',{weekday:'short'}).slice(0,2)}<i class="${s.has(dk(d))?'y':''}"></i></div>`).join('')}</div><h2>Badges</h2>${B.map(([b,y])=>`<span class="chip bd ${y?'y hot':''}">${b}</span>`).join('')}<h2>Little <em>journal</em></h2><textarea id="jn" rows="3" placeholder="How do you feel today?">${esc(S.j[today()]||'')}</textarea><button class="btn sm" style="margin-top:8px" data-a="jr">Save note</button>${Object.keys(S.j).sort().reverse().slice(0,5).map(d=>S.j[d]?`<div class="card" style="margin-top:10px"><small>${d}</small><br>${esc(S.j[d])}</div>`:'').join('')}<h2>History</h2>${S.h.slice(-6).reverse().map(x=>`<div class="li"><b>${esc(x.n)}</b><small>${x.d} · ${x.m} min</small></div>`).join('')||'<p>Your first workout will show up here.</p>'}`}};
const stats=()=>`<div class="stats">${[[S.h.length,'workouts'],[mins(),'active minutes'],[streak(),'day streak'],[S.h.filter(x=>x.d>dk(new Date(Date.now()-6*864e5))).length,'this week']].map(([a,b])=>`<div class="card"><b>${a}</b>${b}</div>`).join('')}</div>`;
const lib=()=>XS.filter(x=>(LF=='all'||x.c==LF)&&(x.n+' '+x.m).toLowerCase().includes(LQ.toLowerCase())).map(exCard).join('')||'<p>No matches yet.</p>';
const res=()=>XS.filter(x=>x.n.toLowerCase().includes((ED.q||'').toLowerCase())).slice(0,14).map(x=>`<button class="chip" style="border:0" data-a="add" data-id="${x.id}">+ ${x.n}</button>`).join('');
function editor(){return `<h1>${ED.id?'Edit':'New'} <em>workout</em></h1><input data-f="name" aria-label="Workout name" value="${esc(ED.name)}"><div class="row" style="margin:12px 0"><label>Rest between moves (sec) <input type="number" min="0" max="60" data-f="rest" value="${ED.rest}"></label></div><b id="tot"></b><div id="ei"></div><h3 style="margin-top:18px">Add exercises</h3><input data-f="q" placeholder="Search the library" aria-label="Search exercises to add" value="${esc(ED.q||'')}"><div id="res" style="margin:10px 0">${res()}</div><div class="row"><button class="btn" data-a="save">Save workout</button><button class="btn s" data-a="startEd">Start now</button>${ED.id?`<button class="btn s" data-a="del">${ED.cd?'Tap again to delete':'Delete'}</button>`:''}<button class="btn s" data-a="cancel">Close</button></div>`}
function items(){$('#ei').innerHTML=ED.items.length?ED.items.map((it,i)=>`<div class="li" draggable="true" data-i="${i}"><span aria-hidden="true">⠿</span><b>${X[it.id].n}</b><input type="number" min="10" max="180" data-f="d" data-i="${i}" aria-label="Seconds" value="${it.d}">s<button class="ib" data-a="up" data-i="${i}" aria-label="Move up">${ic(I.up)}</button><button class="ib" data-a="dn" data-i="${i}" aria-label="Move down">${ic(I.dn)}</button><button class="ib" data-a="rm" data-i="${i}" aria-label="Remove">${ic(I.trash)}</button></div>`).join(''):'<p>Nothing here yet. Add a move below.</p>';tot()}
const tot=()=>{const e=$('#tot');if(e)e.textContent=`${ED.items.length} exercises · ${fm(wDur(ED))} total`};
const clone=w=>({name:w.name+' (mine)',rest:w.rest,items:w.items.map(i=>({...i}))});
function nav(){$('#nv').innerHTML=`<div class="logo">${CH} Cherry Move</div>`+NAV.map(([k,l,d])=>`<button data-a="go" data-v="${k}" class="${V==k?'on':''}" aria-label="${l}">${ic(d)}<span>${l}</span></button>`).join('')}
function render(){nav();const a=$('#app');a.innerHTML=V0[V]();a.classList.remove('pg');void a.offsetWidth;a.classList.add('pg');if(ED&&V=='mine')items()}
/* modal */
function modal(id){const x=X[id];$('#md').hidden=false;$('#md').innerHTML=`<div class="mc" role="dialog" aria-modal="true">${CHAR(x.a)}<h2 style="margin-top:0">${x.n}</h2><span class="chip ${x.l==3?'hot':''}">${LV[x.l]}</span><span class="chip">${CL[x.c]}</span><span class="chip">${x.du}</span>${x.a!=x.id?'<p><small>The animation shows the closest movement pattern, not the exact exercise.</small></p>':''}<p><b>Muscles:</b> ${x.m}</p><p><b>How:</b> ${x.how}</p><p><b>Easier:</b> ${x.mod}</p><p><b>Form and safety:</b> ${x.tip}</p><div class="row"><button class="btn" data-a="add" data-id="${id}">${ic(I.plus)} Add to My Workout</button><button class="btn s" data-a="cm">Close</button></div></div>`}
/* player */
const nEx=()=>PL.steps.slice(0,PL.i+1).filter(s=>s.k=='ex').length,MSG=["You’ve got this, girl!","One more, you’re doing amazing!","Look at you showing up for yourself!","Strong and glowing!"];
function startW(w){if(!w||!w.items.length)return toast('Add at least one exercise first');const steps=[];w.items.forEach((it,i)=>{steps.push({k:'ex',ex:X[it.id],d:it.d});if(i<w.items.length-1&&w.rest>0)steps.push({k:'rest',d:w.rest,nx:X[w.items[i+1].id]})});PL={w,steps,i:0,left:steps[0].d*1000,paused:false,last:Date.now(),act:0,sec:-1};clearInterval(tm);tm=setInterval(tick,200);beep(660);showPl();setMus()}
function showPl(){const s=PL.steps[PL.i],ex=s.k=='ex',tl=PL.w.items.length;$('#pl').hidden=false;$('#pl').innerHTML=`<div class="plin"><div class="top"><button class="ib" data-a="exit" aria-label="Exit workout">${ic(I.x)}</button><b>Exercise ${nEx()} of ${tl}</b><div class="row"><button class="ib ${sfx?'':'off'}" data-a="sfx" aria-label="Sound effects">${ic(I.snd)}</button><button class="ib ${musOn?'':'off'}" data-a="mus" aria-label="Music">${ic(I.mus)}</button></div></div><div class="bar"><i id="bar"></i></div><div class="bub" id="pb">${ex?MSG[PL.i%MSG.length]:'Rest a little, queen!'}</div>${CHAR(ex?s.ex.a:'idle')}<h1 style="margin-top:6px">${ex?s.ex.n:'Rest and breathe'}</h1><div class="tm" id="tm">${Math.ceil(PL.left/1000)}</div><p>${ex?(PL.steps[PL.i+1]?'Next: '+(PL.steps[PL.i+1].k=='rest'?PL.steps[PL.i+2]?.ex.n||'Finish':PL.steps[PL.i+1].ex.n):'Last one! Finish strong.'):'Next: '+s.nx.n}</p><div class="ctl"><button class="ib" data-a="prev" aria-label="Previous">${ic(I.prev)}</button><button class="ib big" data-a="pause" aria-label="${PL.paused?'Resume':'Pause'}">${ic(PL.paused?I.play:I.pause,PL.paused)}</button><button class="ib" data-a="next" aria-label="${ex?'Skip exercise':'Skip rest'}">${ic(I.next)}</button></div>${ex?'':'<small>Press next to skip rest</small>'}</div>`;bar()}
function bar(){const s=PL.steps[PL.i],b=$('#bar');if(b)b.style.width=Math.min(100,(PL.i+1-PL.left/(s.d*1000))/PL.steps.length*100)+'%'}
function tick(){if(!PL)return;const n=Date.now(),dt=Math.min(n-PL.last,1500);PL.last=n;if(PL.paused)return;PL.left-=dt;if(PL.steps[PL.i].k=='ex')PL.act+=dt;if(PL.left<=0)return go2(1);const s=Math.ceil(PL.left/1000);if(s!=PL.sec){PL.sec=s;if(s<=3)beep(880,.1)}const t=$('#tm');if(t)t.textContent=s;bar()}
function go2(d){PL.i+=d;if(PL.i>=PL.steps.length)return finish();if(PL.i<0)PL.i=0;PL.left=PL.steps[PL.i].d*1000;PL.sec=-1;beep(PL.steps[PL.i].k=='ex'?660:440,.25);showPl()}
function finish(){clearInterval(tm);clearInterval(mt);const w=PL.w,m=Math.max(1,Math.round(PL.act/60000));S.h.push({d:today(),n:w.name,m,c:w.items.length});save();beep(784,.4);const id=w.id||'ed';PL=null;$('#pl').innerHTML=`<div class="plin"><h1>You did it, <em>gorgeous!</em></h1>${CHAR('jacks')}<p>${w.items.length} exercises completed · about ${m} min of movement. Look at you showing up for yourself.</p><div class="row" style="justify-content:center"><button class="btn" data-a="again" data-id="${id}">Repeat workout</button><button class="btn s" data-a="exit">Back home</button></div></div>`;const c=['#d62f4b','#f9c6d0','#e4d9f7','#ffdcc4','#d98b9b'];for(let i=0;i<40;i++){const e=document.createElement('span');e.className='cf';e.style.cssText=`left:${Math.random()*100}%;background:${c[i%5]};animation-delay:${Math.random()*.8}s`;document.body.appendChild(e);setTimeout(()=>e.remove(),4000)}}
function exit(){clearInterval(tm);clearInterval(mt);PL=null;$('#pl').hidden=true;V='home';render()}
/* actions */
const A={go:d=>{V=d.v;ED=V=='mine'?ED:ED;render();scrollTo(0,0)},start:d=>{const w=findW(d.id);S.ws.find(x=>x.id==d.id)||PRE.find(x=>x.id==d.id)||d.id=='ed'?startW(w):0},again:d=>{startW(findW(d.id))},cat:d=>{SC=d.k;V='workouts';render()},clone:d=>{ED=clone(findW(d.id));V='mine';render()},ex:d=>modal(d.id),cm:()=>{$('#md').hidden=true},lf:d=>{LF=d.k;render()},
add:d=>{if(!ED)ED={name:'My Cute Routine',rest:10,items:[]};const du=X[d.id].du;ED.items.push({id:d.id,d:parseInt(du)&&du.endsWith('s')?parseInt(du):30});if(V=='mine'){items()}else toast('Added to your draft in My Workouts')},
new:()=>{ED={name:'My Cute Morning Routine',rest:10,items:[]};render()},edit:d=>{ED=JSON.parse(JSON.stringify(S.ws.find(w=>w.id==d.id)));render()},
rm:d=>{ED.items.splice(+d.i,1);items()},up:d=>{const i=+d.i;if(i>0){[ED.items[i-1],ED.items[i]]=[ED.items[i],ED.items[i-1]];items()}},dn:d=>{const i=+d.i;if(i<ED.items.length-1){[ED.items[i+1],ED.items[i]]=[ED.items[i],ED.items[i+1]];items()}},
save:()=>{if(!ED.items.length)return toast('Add at least one exercise');ED.name=ED.name.trim()||'My Workout';delete ED.q;delete ED.cd;if(!ED.id){ED.id='u'+Date.now();S.ws.push(ED)}else{const i=S.ws.findIndex(w=>w.id==ED.id);i<0?S.ws.push(ED):S.ws[i]=ED}save();ED=null;toast('Workout saved');render()},
startEd:()=>{if(!ED.id)ED.id=undefined;startW(ED)},cancel:()=>{ED=null;render()},del:()=>{if(!ED.cd){ED.cd=1;render();return}S.ws=S.ws.filter(w=>w.id!=ED.id);save();ED=null;render()},
pause:()=>{PL.paused=!PL.paused;PL.last=Date.now();showPl();setMus()},next:()=>go2(1),prev:()=>go2(-1),exit,sfx:()=>{sfx=!sfx;showPl()},mus:()=>{musOn=!musOn;setMus();showPl()},jr:()=>{S.j[today()]=$('#jn').value;save();toast('Note saved')}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a])A[b.dataset.a](b.dataset)});
document.addEventListener('input',e=>{const f=e.target.dataset.f;if(!f)return;const v=e.target.value;if(f=='lq'){LQ=v;$('#lr').innerHTML=lib()}else if(f=='name')ED.name=v;else if(f=='rest'){ED.rest=Math.max(0,Math.min(60,+v||0));tot()}else if(f=='q'){ED.q=v;$('#res').innerHTML=res()}else if(f=='d'){ED.items[+e.target.dataset.i].d=Math.max(5,Math.min(300,+v||5));tot()}});
let dg=null;document.addEventListener('dragstart',e=>{const l=e.target.closest&&e.target.closest('[data-i][draggable]');if(l)dg=+l.dataset.i});document.addEventListener('dragover',e=>{if(dg!==null)e.preventDefault()});
document.addEventListener('drop',e=>{const l=e.target.closest('[data-i][draggable]');if(l&&dg!==null){e.preventDefault();const t=+l.dataset.i,[m]=ED.items.splice(dg,1);ED.items.splice(t,0,m);items()}dg=null});
document.addEventListener('keydown',e=>{if(e.key=='Escape')$('#md').hidden=true});
let mi=0;setInterval(()=>{const h=$('#hb'),p=$('#pb');if(h)h.textContent=MSG[++mi%MSG.length];if(p&&PL&&PL.steps[PL.i].k=='ex')p.textContent=MSG[++mi%MSG.length]},5000);
render();
</script></body></html>
